# Add this to your Codex skill's agents/openai.yaml.
# The lightweight MCP client connects to or starts the shared Browser Broker.
dependencies:
  tools:
    - type: "mcp"
      value: "arc-tunnel"
      description: "Arc Tunnel client for the shared multi-agent Browser Broker"
      transport: "stdio"
      command: "node"
      args:
        - "{{REPO_PATH}}/mcp-server/dist/mcp-server.js"
      env:
        WS_PORT: "8765"
